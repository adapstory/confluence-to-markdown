[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-to-markdown"
version = "0.1.0"
description = "Loss-aware conversion of an unpacked Confluence Scroll HTML export to portable GFM"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
]

[project.optional-dependencies]
pdf = [
  "PyMuPDF>=1.26,<2",
]
ocr = [
  "rapidocr==3.9.2",
  "onnxruntime==1.29.0",
]
dev = [
  "pyright==1.1.411",
  "ruff==0.16.6",
]

[project.scripts]
confluence-to-md = "confluence_to_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
